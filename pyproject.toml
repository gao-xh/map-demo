[project]
name = "decay-fit"
version = "0.1.0"
description = "Fit exponential decay times, with uncertainties, to measurement runs (example project for the MAP demo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
decay-fit = "decay_fit.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
